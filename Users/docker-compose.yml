version: '3.8'

services:
  user-registration-service:
    image: keylet30/users-wedding:user-registration
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    ports:
      - "3006:3006"
    depends_on:
      - mysql-db
    networks:
      - users_network

  user-login-service:
    image: keylet30/users-wedding:user-login
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    ports:
      - "3007:3007"
    depends_on:
      - mysql-db
    networks:
      - users_network

  user-update-service:
    image: keylet30/users-wedding:user-update
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    ports:
      - "3008:3008"
    depends_on:
      - mysql-db
    networks:
      - users_network

  user-delete-service:
    image: keylet30/users-wedding:user-delete
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    ports:
      - "3009:3009"
    depends_on:
      - mysql-db
    networks:
      - users_network

  user-get-service:
    image: keylet30/users-wedding:user-get
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
    ports:
      - "3010:3010"
    depends_on:
      - mysql-db
    networks:
      - users_network

  mysql-db:
    image: keylet30/users-wedding:mysql-8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - users_network

  phpmyadmin:
    image: keylet30/users-wedding:phpmyadmin-latest
    environment:
      PMA_HOST: ${DB_HOST}
    ports:
      - "80:80"
    networks:
      - users_network

networks:
  users_network:
    driver: bridge

volumes:
  mysql-data:
