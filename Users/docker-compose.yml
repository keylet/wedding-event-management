services:
  mysql-db:
    image: mysql:8.0
    container_name: users-mysql-db
    restart: always
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE:    "${DB_NAME}"
      MYSQL_USER:        "${DB_USER}"
      MYSQL_PASSWORD:    "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: "${MYSQL_ALLOW_EMPTY_PASSWORD}"
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - users_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: users-phpmyadmin
    restart: always
    depends_on:
      - mysql-db
    env_file:
      - ./.env
    ports:
      - "8081:80"
    environment:
      PMA_HOST:     "${DB_HOST}"
      PMA_USER:     "${DB_USER}"
      PMA_PASSWORD: "${DB_PASSWORD}"
    networks:
      - users_network

  user-registration-service:
    build:
      context: ./user-registration-service
      dockerfile: Dockerfile
    image: keylet30/users-wedding:user-registration
    container_name: users-user-registration-service
    restart: on-failure
    depends_on:
      - mysql-db
    env_file:
      - ./.env
    ports:
      - "3006:3006"
    networks:
      - users_network

  user-login-service:
    build:
      context: ./login-service
      dockerfile: Dockerfile
    image: keylet30/users-wedding:user-login
    container_name: users-user-login-service
    restart: on-failure
    depends_on:
      - mysql-db
    env_file:
      - ./.env
    ports:
      - "3007:3007"
    networks:
      - users_network

  user-update-service:
    build:
      context: ./update-user-service
      dockerfile: Dockerfile
    image: keylet30/users-wedding:user-update
    container_name: users-user-update-service
    restart: on-failure
    depends_on:
      - mysql-db
    env_file:
      - ./.env
    ports:
      - "3008:3008"
    networks:
      - users_network

  user-delete-service:
    build:
      context: ./delete-user-service
      dockerfile: Dockerfile
    image: keylet30/users-wedding:user-delete
    container_name: users-user-delete-service
    restart: on-failure
    depends_on:
      - mysql-db
    env_file:
      - ./.env
    ports:
      - "3009:3009"
    networks:
      - users_network

  user-get-service:
    build:
      context: ./get-user-service
      dockerfile: Dockerfile
    image: keylet30/users-wedding:user-get
    container_name: users-user-get-service
    restart: on-failure
    depends_on:
      - mysql-db
    env_file:
      - ./.env
    ports:
      - "3010:3010"        # <-- aquí debe ser una lista, no una cadena sola
    networks:
      - users_network

  users-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: keylet30/users-wedding:frontend
    container_name: users-frontend
    restart: on-failure
    depends_on:
      - user-registration-service
      - user-login-service
      - user-update-service
      - user-delete-service
      - user-get-service
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - users_network

volumes:
  mysql_data:

networks:
  users_network:
    driver: bridge
