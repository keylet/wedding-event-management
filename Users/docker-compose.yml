services:
  mysql-db:
    image: keylet30/users-wedding:mysql-8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - users_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mysql-db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql-db
    networks:
      - users_network

  user-registration-service:
    image: keylet30/users-wedding:user-registration
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3006
    ports:
      - "3006:3006"
    depends_on:
      - mysql-db
    restart: on-failure
    networks:
      - users_network

  user-login-service:
    image: keylet30/users-wedding:user-login
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3007
    ports:
      - "3007:3007"
    depends_on:
      - mysql-db
    restart: on-failure
    networks:
      - users_network

  user-update-service:
    image: keylet30/users-wedding:user-update
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3008
    ports:
      - "3008:3008"
    depends_on:
      - mysql-db
    restart: on-failure
    networks:
      - users_network

  user-delete-service:
    image: keylet30/users-wedding:user-delete
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3009
    ports:
      - "3009:3009"
    depends_on:
      - mysql-db
    restart: on-failure
    networks:
      - users_network

  user-get-service:
    image: keylet30/users-wedding:user-get
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3010
    ports:
      - "3010:3010"
    depends_on:
      - mysql-db
    restart: on-failure
    networks:
      - users_network

  users-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: keylet30/users-wedding:frontend
    ports:
      - "80:80"
    depends_on:
      - user-registration-service
      - user-login-service
      - user-update-service
      - user-delete-service
      - user-get-service
    restart: on-failure
    networks:
      - users_network

volumes:
  mysql_data:

networks:
  users_network: