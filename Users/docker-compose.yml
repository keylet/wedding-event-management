networks:
  user-network:
    driver: bridge
services:
  mysql-db:
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
    image: keylet30/users-wedding:mysql-8.0
    networks:
    - users_network
    volumes:
    - mysql-data:/var/lib/mysql
  phpmyadmin:
    environment:
      PMA_HOST: ${DB_HOST}
    image: keylet30/users-wedding:phpmyadmin-latest
    networks:
    - users_network
    ports:
    - 80:80
  user-delete-service:
    depends_on:
    - mysql-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
    image: keylet30/users-wedding:user-delete
    networks:
    - users_network
    ports:
    - 3009:3009
  user-get-service:
    depends_on:
    - mysql-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
    image: keylet30/users-wedding:user-get
    networks:
    - users_network
    ports:
    - 3010:3010
  user-login-service:
    depends_on:
    - mysql-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
    image: keylet30/users-wedding:user-login
    networks:
    - users_network
    ports:
    - 3007:3007
  user-registration-service:
    depends_on:
    - mysql-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
    image: keylet30/users-wedding:user-registration
    networks:
    - users_network
    ports:
    - 3006:3006
  user-update-service:
    depends_on:
    - mysql-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
    image: keylet30/users-wedding:user-update
    networks:
    - users_network
    ports:
    - 3008:3008
version: '3.8'
volumes:
  mysql-data: null