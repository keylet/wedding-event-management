server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Crear & Listar
    location = /api/register { proxy_pass http://user-registration-service:3006; }
    location = /api/login    { proxy_pass http://user-login-service:3007; }
    location = /api/users    { proxy_pass http://user-get-service:3010; }

    # Operaciones por username o id
    location ~ ^/api/users/[^/]+$ {
        if ($request_method = GET)    { proxy_pass http://user-get-service:3010; }
        if ($request_method = PUT)    { proxy_pass http://user-update-service:3008; }
        if ($request_method = DELETE) { proxy_pass http://user-delete-service:3009; }
    }

    proxy_http_version 1.1;
    proxy_set_header   Host            $host;
    proxy_set_header   X-Real-IP       $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
}
