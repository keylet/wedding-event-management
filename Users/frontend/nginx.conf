server {
    listen 80;
    server_name _;

    # 1) Archivos estáticos + SPA fallback
    root   /usr/share/nginx/html;
    index  index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2) Endpoints concretos de tu API
    # Crear usuario
    location = /api/register {
        proxy_pass         http://user-registration-service:3006/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # Login
    location = /api/login {
        proxy_pass         http://user-login-service:3007/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # Listar todos los users
    location = /api/users {
        proxy_pass         http://user-get-service:3010/;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    }

    # GET, PUT, DELETE a /api/users/:id o /api/users/:username
    location ~ ^/api/users/[^/]+$ {
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

        if ($request_method = GET)    { proxy_pass http://user-get-service:3010/; }
        if ($request_method = PUT)    { proxy_pass http://user-update-service:3008/; }
        if ($request_method = DELETE) { proxy_pass http://user-delete-service:3009/; }
    }
}
