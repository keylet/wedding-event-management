# .github/workflows/provinces-locations-deploy.yml
name: provinces-locations-deploy

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROVINCES_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROVINCES_HOST }}" >> ~/.ssh/known_hosts

      - name: Build & push with Docker Compose
        working-directory: Provinces-Locations
        run: |
          docker compose build
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker compose push

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.EC2_USER }}@${{ secrets.PROVINCES_HOST }}" <<EOF
            set -e

            # Repo URL y directorio remoto
            REPO_URL="https://github.com/keylet30/wedding-event-management.git"
            REMOTE_DIR="\$HOME/Provinces-Locations"

            # Clonar si no existe
            if [ ! -d "\$REMOTE_DIR/.git" ]; then
              git clone "\$REPO_URL" "\$REMOTE_DIR"
            fi

            cd "\$REMOTE_DIR"

            # Actualizar rama qa
            git fetch origin qa
            git checkout qa
            git pull origin qa

            # Pull de imágenes y levantar servicios
            sudo docker compose pull
            sudo docker compose up -d
          EOF
