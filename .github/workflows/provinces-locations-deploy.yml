# .github/workflows/provinces-locations-deploy.yml
name: provinces-locations-deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROVINCES_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROVINCES_HOST }}" >> ~/.ssh/known_hosts

      - name: Build & push Docker image
        run: |
          docker build -t keylet30/province-locations-wedding:latest .
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker push keylet30/province-locations-wedding:latest

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.EC2_USER }}@${{ secrets.PROVINCES_HOST }}" << 'EOF'
            # Stop & remove old app container
            docker stop provinces-locations || true
            docker rm provinces-locations  || true

            # Run provinces-locations with MongoDB env vars
            docker run -d \
              --name provinces-locations \
              -p 4002:4002 \
              -e MONGO_DB_HOST="${{ secrets.MONGO_DB_HOST }}" \
              -e MONGO_DB_PORT="${{ secrets.MONGO_DB_PORT }}" \
              -e MONGO_DB_USER="${{ secrets.MONGO_DB_USER }}" \
              -e MONGO_DB_PASSWORD="${{ secrets.MONGO_DB_PASSWORD }}" \
              -e MONGO_DB_NAME="${{ secrets.MONGO_DB_NAME }}" \
              keylet30/province-locations-wedding:latest

            # Stop & remove old mongo-express container
            docker stop mongo-express || true
            docker rm mongo-express  || true

            # Run mongo-express alongside
            docker run -d \
              --name mongo-express \
              -p 8081:8081 \
              -e ME_CONFIG_MONGODB_SERVER="${{ secrets.MONGO_DB_HOST }}" \
              -e ME_CONFIG_MONGODB_PORT="${{ secrets.MONGO_DB_PORT }}" \
              -e ME_CONFIG_MONGODB_ADMINUSERNAME="${{ secrets.MONGO_DB_USER }}" \
              -e ME_CONFIG_MONGODB_ADMINPASSWORD="${{ secrets.MONGO_DB_PASSWORD }}" \
              -e ME_CONFIG_MONGODB_AUTH_DATABASE="${{ secrets.MONGO_DB_NAME }}" \
              mongo-express:latest
          EOF
