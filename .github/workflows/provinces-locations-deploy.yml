# .github/workflows/provinces-locations-deploy.yml
name: provinces-locations-deploy

on:
  push:
    branches:
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROVINCES_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.PROVINCES_HOST }}" >> ~/.ssh/known_hosts

      - name: Build & push images with Docker Compose
        working-directory: Provinces-Locations
        run: |
          # Build all services & frontend
          docker compose build
          # Login to Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          # Push images (must have image: keys in docker-compose.yml)
          docker compose push

      - name: Deploy to EC2 via Docker Compose
        run: |
          ssh -i ~/.ssh/id_rsa "${{ secrets.EC2_USER }}@${{ secrets.PROVINCES_HOST }}" << 'EOF'
            cd ~/provinces-locations   # Ajusta si tu carpeta remota tiene otro nombre/capitalización

            # Actualizar código
            git fetch
            git checkout qa
            git pull origin qa

            # Traer nuevas imágenes y recrear servicios
            docker compose pull
            docker compose up -d
          EOF
