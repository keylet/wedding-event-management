name: CI for QA Environment

on:
  push:
    branches:
      - qa   
  pull_request:
    branches:
      - prod 

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          docker build -t <aws_account_id>.dkr.ecr.<region>.amazonaws.com/wedding-event-management:create-user-latest .
          docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/wedding-event-management:create-user-latest

      - name: Check out code
        uses: actions/checkout@v2  

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  

      - name: Install dependencies
        run: |
          
         
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: wedding_event_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d wedding_event_management"
          --health-timeout=30s
          --health-start-period=5s
          --health-retries=5

