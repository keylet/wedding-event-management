name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        options: >-
          --health-cmd="pg_isready -U admin -d wedding_event_management"
          --health-timeout=30s
          --health-start-period=5s
          --health-retries=5
          -e POSTGRES_USER=admin
          -e POSTGRES_PASSWORD=admin123
          -e POSTGRES_DB=wedding_event_management
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image for create-user
        run: |
          docker build -t <aws_account_id>.dkr.ecr.<region>.amazonaws.com/wedding-event-management:create-user-latest .
          docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/wedding-event-management:create-user-latest

      - name: Build and push Docker image for update-user
        run: |
          docker build -t <aws_account_id>.dkr.ecr.<region>.amazonaws.com/wedding-event-management:update-user-latest .
          docker push <aws_account_id>.dkr.ecr.<region>.amazonaws.com/wedding-event-management:update-user-latest

      - name: Build and push Docker image for login-logout
        run: |
          docker
