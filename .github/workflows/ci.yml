name: CI for QA Environment

on:
  push:
    branches:
      - qa  
  pull_request:
    branches:
      - prod  

jobs:
  test:
    runs-on: ubuntu-latest  

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: wedding_event_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d wedding_event_management"
          --health-timeout=30s
          --health-start-period=5s
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v2  

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  

      - name: Install dependencies
        run: |
          npm install
