# .github/workflows/provinces-locations.yml
name: Deploy Provinces-Locations Services

on:
  push:
    branches: [ qa ]
    paths:
      - 'Provinces-Locations/**'
  workflow_dispatch:

env:
  DOCKERHUB_REPO: keylet30/province-locations-wedding

jobs:
  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.PL_DOCKERHUB_TOKEN }}

      - name: Build & push provinces-get
        run: |
          docker build -t $DOCKERHUB_REPO:provinces-get ./Provinces-Locations/microservice_provinces_get
          docker push $DOCKERHUB_REPO:provinces-get

      - name: Build & push provinces-delete
        run: |
          docker build -t $DOCKERHUB_REPO:provinces-delete ./Provinces-Locations/microservice_provinces_delete
          docker push $DOCKERHUB_REPO:provinces-delete

      - name: Build & push locations-get
        run: |
          docker build -t $DOCKERHUB_REPO:locations-get ./Provinces-Locations/microservice_locations_get
          docker push $DOCKERHUB_REPO:locations-get

      - name: Build & push locations-create
        run: |
          docker build -t $DOCKERHUB_REPO:locations-create ./Provinces-Locations/microservice_locations_create
          docker push $DOCKERHUB_REPO:locations-create

      - name: Build & push locations-delete
        run: |
          docker build -t $DOCKERHUB_REPO:locations-delete ./Provinces-Locations/microservice_locations_delete
          docker push $DOCKERHUB_REPO:locations-delete

      - name: Build & push frontend
        run: |
          docker build -t $DOCKERHUB_REPO:frontend ./Provinces-Locations/frontend
          docker push $DOCKERHUB_REPO:frontend

  deploy-remote:
    name: Deploy on Remote Server
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.PL_SSH_PRIVATE_KEY }}

      - name: SSH & Deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.PL_SSH_USER }}@${{ secrets.PL_SSH_HOST }} << 'EOF'
            cd ~/wedding-event-management/Provinces-Locations

            # Instala Docker Compose plugin v2 si no existe
            if ! docker compose version > /dev/null 2>&1; then
              sudo mkdir -p /usr/lib/docker/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-linux-x86_64 \
                -o /usr/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/lib/docker/cli-plugins/docker-compose
            fi

            # Pull & recreate using Compose v2
            docker compose pull
            docker compose up -d
          EOF
