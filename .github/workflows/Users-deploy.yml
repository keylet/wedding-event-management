name: Build & Deploy to EC2

on:
  push:
    branches:
      - qa

env:
  DOCKERHUB_REPO: keylet30/users-wedding
  REPO_URL:       https://github.com/keylet/wedding-event-management.git
  DEPLOY_BASE:    /home/${{ secrets.EC2_USER }}/wedding-event-management

jobs:
  build-and-push:
    name: 📦 Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push user-registration
        run: |
          docker build -f Users/user-registration-service/Dockerfile \
                       -t $DOCKERHUB_REPO:user-registration .
          docker push $DOCKERHUB_REPO:user-registration

      - name: Build & push user-login
        run: |
          docker build -f Users/login-service/Dockerfile \
                       -t $DOCKERHUB_REPO:user-login .
          docker push $DOCKERHUB_REPO:user-login

      - name: Build & push user-get
        run: |
          docker build -f Users/get-user-service/Dockerfile \
                       -t $DOCKERHUB_REPO:user-get .
          docker push $DOCKERHUB_REPO:user-get

      - name: Build & push user-update
        run: |
          docker build -f Users/update-user-service/Dockerfile \
                       -t $DOCKERHUB_REPO:user-update .
          docker push $DOCKERHUB_REPO:user-update

      - name: Build & push user-delete
        run: |
          docker build -f Users/delete-user-service/Dockerfile \
                       -t $DOCKERHUB_REPO:user-delete .
          docker push $DOCKERHUB_REPO:user-delete

      - name: Build & push frontend
        run: |
          docker build -f Users/frontend/Dockerfile \
                       -t $DOCKERHUB_REPO:frontend Users/frontend
          docker
