name: Build & deploy to EC2

on:
  push:
    branches:
      - qa

env:
  DOCKERHUB_REPO: keylet30/users-wedding

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 🚧 Adjust paths below to point at each service/Dockerfile
      - name: Build & push user-registration
        run: |
          docker build -t $DOCKERHUB_REPO:user-registration Users/user-registration-service
          docker push $DOCKERHUB_REPO:user-registration

      - name: Build & push login-service
        run: |
          docker build -t $DOCKERHUB_REPO:user-login Users/login-service
          docker push $DOCKERHUB_REPO:user-login

      - name: Build & push get-service
        run: |
          docker build -t $DOCKERHUB_REPO:user-get Users/get-user-service
          docker push $DOCKERHUB_REPO:user-get

      - name: Build & push update-service
        run: |
          docker build -t $DOCKERHUB_REPO:user-update Users/update-user-service
          docker push $DOCKERHUB_REPO:user-update

      - name: Build & push delete-service
        run: |
          docker build -t $DOCKERHUB_REPO:user-delete Users/delete-user-service
          docker push $DOCKERHUB_REPO:user-delete

      - name: Build & push frontend
        run: |
          docker build -t $DOCKERHUB_REPO:frontend Users/frontend
          docker push $DOCKERHUB_REPO:frontend

  deploy:
    name: SSH & deploy on EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/wedding-event-management/Users
            git fetch origin qa
            git reset --hard origin/qa
            docker-compose pull
            docker-compose up -d --build --remove-orphans
          EOF
