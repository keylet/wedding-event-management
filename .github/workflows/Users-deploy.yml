name: Deploy Users Services

on:
  push:
    branches:
      - qa

env:
  DOCKERHUB_REPO: keylet30/users-wedding

jobs:
  debug-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔍 List all files & folders
        run: |
          echo "=== Repo root ==="
          ls -1
          echo ""
          echo "=== Recursive ==="
          ls -R .

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Cada bloque build-push es un servicio distinto
      - name: Build & push user-registration-service
        uses: docker/build-push-action@v4
        with:
          context: ./user-registration-service
          file: ./user-registration-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:user-registration

      - name: Build & push login-service
        uses: docker/build-push-action@v4
        with:
          context: ./login-service
          file: ./login-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:user-login

      - name: Build & push update-user-service
        uses: docker/build-push-action@v4
        with:
          context: ./update-user-service
          file: ./update-user-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:user-update

      - name: Build & push delete-user-service
        uses: docker/build-push-action@v4
        with:
          context: ./delete-user-service
          file: ./delete-user-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:user-delete

      - name: Build & push get-user-service
        uses: docker/build-push-action@v4
        with:
          context: ./get-user-service
          file: ./get-user-service/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:user-get

      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:frontend
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    needs: debug-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/wedding-event-management/Provinces-Locations

            cat > .env <<EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_ALLOW_EMPTY_PASSWORD=${{ secrets.MYSQL_ALLOW_EMPTY_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            EOF

            docker-compose pull
            docker-compose up -d --build
