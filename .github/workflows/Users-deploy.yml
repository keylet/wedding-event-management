name: Deploy Users Services

on:
  push:
    branches: [ qa ]

env:
  DOCKERHUB_REPO: keylet30/users-wedding

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build & Push Docker images
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push user-registration-service
        uses: docker/build-push-action@v4
        with:
          context: ./Users/user-registration-service
          file:    ./Users/user-registration-service/Dockerfile
          push:    true
          tags:    ${{ env.DOCKERHUB_REPO }}:user-registration

      - name: Build & push login-service
        uses: docker/build-push-action@v4
        with:
          context: ./Users/login-service
          file:    ./Users/login-service/Dockerfile
          push:    true
          tags:    ${{ env.DOCKERHUB_REPO }}:user-login

      - name: Build & push update-user-service
        uses: docker/build-push-action@v4
        with:
          context: ./Users/update-user-service
          file:    ./Users/update-user-service/Dockerfile
          push:    true
          tags:    ${{ env.DOCKERHUB_REPO }}:user-update

      - name: Build & push delete-user-service
        uses: docker/build-push-action@v4
        with:
          context: ./Users/delete-user-service
          file:    ./Users/delete-user-service/Dockerfile
          push:    true
          tags:    ${{ env.DOCKERHUB_REPO }}:user-delete

      - name: Build & push get-user-service
        uses: docker/build-push-action@v4
        with:
          context: ./Users/get-user-service
          file:    ./Users/get-user-service/Dockerfile
          push:    true
          tags:    ${{ env.DOCKERHUB_REPO }}:user-get

      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./Users/frontend
          file:    ./Users/frontend/Dockerfile
          push:    true
          tags:    ${{ env.DOCKERHUB_REPO }}:frontend
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    name: SSH & Deploy to EC2
    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host:             ${{ secrets.EC2_HOST }}
          username:         ${{ secrets.EC2_USER }}
          key:              ${{ secrets.EC2_SSH_KEY }}
          port:             22
          timeout:          120s
          command_timeout:  600s
          envs: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          script: |
            set -e

            # 1. Clona o actualiza tu repo
            if [ -d ~/wedding-event-management ]; then
              cd ~/wedding-event-management
              git fetch origin qa
              git reset --hard origin/qa
            else
              git clone --branch qa \
                https://x-access-token:$GITHUB_TOKEN@github.com/keylet/wedding-event-management.git \
                ~/wedding-event-management
            fi

            # 2. Entra donde está docker-compose.yml
            cd ~/wedding-event-management/Users

            # 3. Reconstruye tu .env
            cat > .env <<EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_PORT=${{ secrets.DB_PORT }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_ALLOW_EMPTY_PASSWORD=${{ secrets.MYSQL_ALLOW_EMPTY_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            EOF

            # 4. Detén y elimina viejos, luego pull y up
            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d
